[project]
name = "spotter-gen"
version = "0.1.0"
description = "Seeded schedule fixture generator for Schedule Spotter (dev only)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "openpyxl>=3.1",
    "xlwt>=1.3",
    "odfpy>=1.4",
    "python-docx>=1.1",
]

[project.scripts]
spotter-gen = "spotter_gen.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["uv_build>=0.8,<0.13"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
