[workspace]
resolver = "3"
members = ["core", "llm", "bench", "app/src-tauri"]
default-members = ["core", "llm"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "LicenseRef-Proprietary"
publish = false
rust-version = "1.95"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "debuginfo"
