# nginx site for Schedule Spotter's download page on the Raspberry Pi.
# Install: /etc/nginx/sites-available/schedule-spotter, linked from
# sites-enabled (site/README.md). TLS comes from certbot. Replace
# TODO-Austin-domain.example with the real domain.
#
# nginx serves the release files itself (with resume support); for each one
# it asks the Python service (/_auth) whether the link is still good.

limit_req_zone $binary_remote_addr zone=spotter_form:1m rate=6r/m;

server {
    listen 80;
    listen [::]:80;
    server_name TODO-Austin-domain.example;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    # "ssl http2" on the listen line works on Debian 12's nginx 1.22 and,
    # with a deprecation notice, on newer ones.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name TODO-Austin-domain.example;

    ssl_certificate     /etc/letsencrypt/live/TODO-Austin-domain.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/TODO-Austin-domain.example/privkey.pem;

    # No access log: the page promises no tracking. Errors only.
    access_log off;
    server_tokens off;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    location /static/ {
        alias /opt/schedule-spotter-site/static/;
        expires 1h;
    }

    location = /request {
        limit_req zone=spotter_form burst=5 nodelay;
        limit_req_status 429;
        client_max_body_size 4k;
        include /etc/nginx/snippets/schedule-spotter-proxy.conf;
    }

    location ~ ^/files/(?<spotter_token>[^/]+)/(?<spotter_file>[A-Za-z0-9._-]+)$ {
        auth_request /_auth;
        alias /srv/schedule-spotter/releases/$spotter_file;
        default_type application/octet-stream;
        add_header Content-Disposition 'attachment; filename="$spotter_file"' always;
        add_header Cache-Control "private, no-store" always;
        sendfile on;
        tcp_nopush on;
    }

    location = /_auth {
        internal;
        proxy_pass http://127.0.0.1:8088/_auth;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header Range $http_range;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        include /etc/nginx/snippets/schedule-spotter-proxy.conf;
    }
}
