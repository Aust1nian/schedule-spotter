[env]
# llama.cpp: keep quantized weights in their file layout (memory-mapped)
# instead of repacking them into extra anonymous memory at load. Measured on
# Phi-4-mini: 4.10 GB -> 2.88 GB peak, ~10% slower. DECISIONS.md, Phase 4.
GGML_CPU_REPACK = "OFF"

# Intel Macs: one static CPU build. Every Intel Mac that runs macOS 11+ has
# AVX2, FMA and F16C except the 2013 Mac Pro, where the model stays off
# (checked at runtime before loading). DECISIONS.md, Phase 4.
[target.x86_64-apple-darwin]
rustflags = ["-C", "target-feature=+avx2,+fma,+f16c,+bmi2"]

# Linux is development and CI only (not a ship target): one static AVX2
# build, so local benchmarks measure a fast CPU path, not SSE2.
[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "target-feature=+avx2,+fma,+f16c,+bmi2"]
