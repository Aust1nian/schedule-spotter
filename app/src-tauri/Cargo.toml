[package]
name = "schedule-spotter"
description = "Schedule Spotter: finds double-bookings and gaps in a contractor's crew schedule, offline."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
default-run = "schedule-spotter"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
spotter-core = { path = "../../core" }
spotter-llm = { path = "../../llm" }
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console", "Win32_System_ProcessStatus", "Win32_System_Threading"] }
