[package]
name = "spotter-bench"
description = "Model benchmark harness (dev only)."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[[bin]]
name = "spotter-check"
path = "src/bin/spotter-check.rs"

[[bin]]
name = "spotter-bench"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
spotter-core = { path = "../core" }
spotter-llm = { path = "../llm" }
serde_json = "1"
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_ProcessStatus", "Win32_System_Threading"] }
