[package]
name = "spotter-core"
description = "Reading, layout detection, normalization, matching, analysis and export for Schedule Spotter. No UI or model dependencies."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
calamine = { version = "0.36", default-features = false }
chrono = { version = "0.4", default-features = false, features = ["std", "serde"] }
csv = "1.4"
encoding_rs = "0.8"
quick-xml = "0.42"
regex = { version = "1.13", default-features = false, features = ["std", "perf", "unicode"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
snap = "1.1"
unicode-normalization = "0.1"
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }
