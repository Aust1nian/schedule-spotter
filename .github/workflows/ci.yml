name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  core:
    name: core tests and dependency check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install stable --profile minimal -c rustfmt,clippy && rustup default stable
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          # llama.cpp's build options live in .cargo/config.toml; cargo can't see a
          # newly added one, so a change there must not reuse an old build.
          key: cfg-${{ hashFiles('.cargo/config.toml') }}
      - run: cargo fmt --all --check
      - run: cargo clippy -p spotter-core -p spotter-llm -p spotter-bench --all-targets -- -D warnings
      - run: cargo test -p spotter-core -p spotter-llm
      - name: handmade fixtures (script tier)
        run: cargo run --release -q -p spotter-bench --bin spotter-check -- fixtures fixtures/handmade --known-failing fixtures/KNOWN_FAILING.txt
      - uses: astral-sh/setup-uv@v10.3.0
      - name: generator seeds 0-1999 (assignment recall >= 99%)
        run: |
          uv run --project tools/gen spotter-gen --seeds 0-1999 --out "$RUNNER_TEMP/gen"
          cargo run --release -q -p spotter-bench --bin spotter-check -- generated "$RUNNER_TEMP/gen" --min-recall 0.99 --require-clean --require-no-false-merges
      - name: generator self-checks
        run: uv run --project tools/gen pytest -q tools/gen/tests
      - name: holdout stays sealed (verified, never run)
        run: cd fixtures/holdout && sha256sum -c --quiet SEALED.sha256
      - run: python3 tools/check_prompt_leak.py
      - run: python3 tools/depcheck.py
      - name: download site (unit tests, then nginx and the service end to end)
        run: |
          python3 -m unittest discover -s site/tests
          site/tests/integration.sh
      - name: lint workflows
        run: docker run --rm -v "$PWD":/repo -w /repo rhysd/actionlint:1.7.12 -no-color

  build-macos:
    name: build macOS universal disk image
    runs-on: macos-15
    env:
      # Ad-hoc signature until the Developer ID secrets exist (release.yml).
      APPLE_SIGNING_IDENTITY: "-"
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install stable --profile minimal && rustup default stable && rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          # llama.cpp's build options live in .cargo/config.toml; cargo can't see a
          # newly added one, so a change there must not reuse an old build.
          key: cfg-${{ hashFiles('.cargo/config.toml') }}
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm, cache-dependency-path: app/package-lock.json }
      - run: npm ci
        working-directory: app
      - name: Metal compiler (Xcode 26 ships it as a separate component)
        run: xcrun -f metal >/dev/null 2>&1 || xcodebuild -downloadComponent MetalToolchain
      # Licenses folder (the model-off build; release.yml builds the variants).
      - run: |
          overlay="$(python3 tools/release/prepare.py --variant off --platform macos | tail -1)"
          echo "OVERLAY=$overlay" >> "$GITHUB_ENV"
      - run: npx tauri build --target universal-apple-darwin --bundles app --config "$OVERLAY"
        working-directory: app
      - name: precompiled Metal shaders are in the bundle
        run: test -s "target/universal-apple-darwin/release/bundle/macos/Schedule Spotter.app/Contents/Resources/default.metallib"
      - run: python3 tools/depcheck.py
      - run: lipo -archs "target/universal-apple-darwin/release/bundle/macos/Schedule Spotter.app/Contents/MacOS/"*
      # The same disk image release.yml makes.
      - run: |
          tools/release/make-dmg.sh "target/universal-apple-darwin/release/bundle/macos/Schedule Spotter.app" \
            "target/universal-apple-darwin/release/bundle/dmg/Schedule Spotter.dmg"
      - uses: actions/upload-artifact@v7
        with:
          name: macos-dmg
          path: target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error

  build-windows:
    name: build Windows installer
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          # llama.cpp's build options live in .cargo/config.toml; cargo can't see a
          # newly added one, so a change there must not reuse an old build.
          key: cfg-${{ hashFiles('.cargo/config.toml') }}
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm, cache-dependency-path: app/package-lock.json }
      - run: npm ci
        working-directory: app
      - shell: bash
        run: |
          overlay="$(python tools/release/prepare.py --variant off --platform windows | tail -1)"
          echo "OVERLAY=$overlay" >> "$GITHUB_ENV"
      - run: npx tauri build --bundles nsis --config "$env:OVERLAY"
        working-directory: app
      - uses: actions/upload-artifact@v7
        with:
          name: windows-nsis
          path: target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error

  build-linux:
    name: build Linux package (development only)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libxdo-dev librsvg2-dev libayatana-appindicator3-dev
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          # llama.cpp's build options live in .cargo/config.toml; cargo can't see a
          # newly added one, so a change there must not reuse an old build.
          key: cfg-${{ hashFiles('.cargo/config.toml') }}
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm, cache-dependency-path: app/package-lock.json }
      - run: npm ci
        working-directory: app
      - run: npx tauri build --bundles deb
        working-directory: app
      - uses: actions/upload-artifact@v7
        with:
          name: linux-deb
          path: target/release/bundle/deb/*.deb
          if-no-files-found: error

  # Install tests (spec: "Install tests, every release candidate"): the
  # disk image and installer exactly as a client downloads them. Unsigned
  # here; release.yml runs the same tests on the signed variant builds.
  install-macos:
    name: install test ${{ matrix.runner }}
    needs: build-macos
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-26, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with: { name: macos-dmg, path: dist }
      - run: tools/ci/install-test-macos.sh dist/*.dmg "$PWD/install-${{ matrix.runner }}.json" --variant off
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: "install-${{ matrix.runner }}"
          path: "install-*.json"
          if-no-files-found: warn

  install-windows:
    name: install test ${{ matrix.runner }}
    needs: build-windows
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: windows-2025, blocking: true }
          # The x64 build under emulation on Arm; logged, not blocking (spec).
          - { runner: windows-11-arm, blocking: false }
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ !matrix.blocking }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with: { name: windows-nsis, path: dist }
      - shell: pwsh
        run: |
          $setup = (Get-ChildItem dist -Filter *-setup.exe | Select-Object -First 1).FullName
          tools/ci/install-test-windows.ps1 -Installer $setup -Out (Join-Path $PWD "install-${{ matrix.runner }}.json") -Variant off
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: "install-${{ matrix.runner }}"
          path: "install-*.json"
          if-no-files-found: warn

  selftest-linux:
    name: self-test ubuntu-24.04
    needs: build-linux
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y xvfb lsof
      - uses: actions/download-artifact@v8
        with: { name: linux-deb, path: dist }
      - run: tools/ci/selftest-linux.sh dist/*.deb "$PWD/selftest-ubuntu-24.04.json"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: "selftest-ubuntu-24.04"
          path: "selftest-*.json"
          if-no-files-found: warn

  # UI tests (spec: Windows and Linux; WebDriver doesn't cover macOS). They
  # drive a build with the `ui-test` feature, which adds open and save
  # commands that take a path, since WebDriver can't drive system dialogs.
  ui-linux:
    name: UI tests ubuntu-24.04
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libxdo-dev librsvg2-dev libayatana-appindicator3-dev webkit2gtk-driver xvfb
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          key: cfg-${{ hashFiles('.cargo/config.toml') }}
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm, cache-dependency-path: app/package-lock.json }
      - run: npm ci && npm run build
        working-directory: app
      - run: cargo build --release -p schedule-spotter --features "tauri/custom-protocol ui-test"
      - name: app unit tests (installer model payload)
        run: cargo test --release -p schedule-spotter --features "tauri/custom-protocol ui-test"
      - run: cargo install tauri-driver --version 2.0.6 --locked
      - name: UI tests
        env:
          WEBKIT_DISABLE_DMABUF_RENDERER: "1"
        run: xvfb-run -a python3 tools/ui/ui_tests.py --app target/release/schedule-spotter --shots ui-shots
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ui-shots-linux
          path: ui-shots
          if-no-files-found: warn

  ui-windows:
    name: UI tests windows-2025
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          key: cfg-${{ hashFiles('.cargo/config.toml') }}
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm, cache-dependency-path: app/package-lock.json }
      - run: npm ci && npm run build
        working-directory: app
      - run: cargo build --release -p schedule-spotter --features "tauri/custom-protocol ui-test"
      # llama.cpp's DLLs beside the exe, as the installer puts them.
      - run: python tools/ci/collect-llama-libs.py --profile target/release --to target/release
      - name: UI tests
        shell: pwsh
        env:
          PYTHONUTF8: "1"
        run: |
          # The runner image's Edge WebDriver (EdgeWebDriver) drives WebView2.
          $driver = Join-Path $env:EdgeWebDriver "msedgedriver.exe"
          if (-not (Test-Path $driver)) { throw "msedgedriver not found at $driver" }
          $wv2 = Get-ItemProperty "HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}" -ErrorAction SilentlyContinue
          $dv = ((& $driver --version) -replace '^\D*(\d+(\.\d+){3}).*$', '$1')
          "Edge WebDriver $dv, WebView2 runtime $($wv2.pv)"
          # The driver must match the WebView2 runtime, not the Edge browser.
          if ($wv2.pv -and $dv -ne $wv2.pv) {
            try {
              $zip = Join-Path $env:RUNNER_TEMP "edgedriver.zip"
              Invoke-WebRequest "https://msedgedriver.microsoft.com/$($wv2.pv)/edgedriver_win64.zip" -OutFile $zip
              Expand-Archive $zip -DestinationPath (Join-Path $env:RUNNER_TEMP "edgedriver") -Force
              $driver = Join-Path $env:RUNNER_TEMP "edgedriver\msedgedriver.exe"
              "using Edge WebDriver $($wv2.pv)"
            } catch { "could not fetch Edge WebDriver $($wv2.pv): $_" }
          }
          # The UI-test build must start on its own first.
          $p = Start-Process target/release/schedule-spotter.exe -ArgumentList "--self-test","--json-out","$PWD\\uitest-selftest.json" -PassThru -Wait
          "self-test exit $($p.ExitCode)"; Get-Content uitest-selftest.json -ErrorAction SilentlyContinue
          # Edge WebDriver attaches to the app's DevTools port (see ui_tests.py --attach).
          python tools/ui/ui_tests.py --attach --app target/release/schedule-spotter.exe --native-driver $driver --shots ui-shots
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ui-shots-windows
          path: ui-shots
          if-no-files-found: warn
